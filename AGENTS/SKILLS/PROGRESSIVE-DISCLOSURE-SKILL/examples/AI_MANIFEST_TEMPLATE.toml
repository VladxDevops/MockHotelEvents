# AI_MANIFEST.toml - Knowledge Base Control Plane Template
# Hotel Events Planning Platform

[repository]
name = "Hotel Events Planning"
purpose = "Mock enterprise event-driven hospitality platform modeling a customer wedding inquiry journey from Salesforce to MuleSoft, Kafka/PubSub, Redis, and GCP/Terraform."
primary_technologies = [
    "Salesforce",
    "MuleSoft",
    "Apache Kafka",
    "Google Cloud Pub/Sub",
    "Google Cloud Platform (GCP)",
    "Terraform",
    "Redis / Cloud Memorystore",
    "OpenTelemetry",
    "GitOps (ArgoCD/Flux)"
]
supported_ai_models = [
    "Gemini 1.5 Pro / Flash",
    "Gemma 2",
    "Claude 3.5 Sonnet",
    "Ollama Local LLMs"
]
supported_ides = ["Antigravity", "VS Code", "Continue", "Codex"]
documentation_version = "1.0.0"
knowledge_version = "1.0.0"

[conventions]
metadata_format = "TOML Front Matter (+++ ... +++)"
progressive_disclosure_layers = [
    "Tier 1: Master Entry Points & Discovery Indexes (Agents.md, AI_MANIFEST.toml, spects.md)",
    "Tier 2: System Architecture & Cross-Cutting Directives (DOCUMENTATION/INTERNAL/ARCHITECTURE/, security.md)",
    "Tier 3: Domain & Subproject Implementation Guides (SUBPROJECTS/, PLATFORM/PROVIDERS/GCP/TERRAFORM/)",
    "Tier 4: Operational Runbooks, Practice Labs & Troubleshooting (TROUBLEMAKER/, practice-lab.md, TROUBLESHOOTING/)"
]
breadcrumbs_standard = "Markdown headers with file:// links to parent, children, and related documents."
machine_hints_standard = "HTML comment block <!-- AI RETRIEVAL HINTS ... --> specifying Purpose, Questions Answered, When to Retrieve, When NOT to Retrieve."

[directory_map]
root = "Agents.md"
internal_docs = "DOCUMENTATION/INTERNAL/"
architecture = "DOCUMENTATION/INTERNAL/ARCHITECTURE/"
subprojects = "SUBPROJECTS/"
platform = "PLATFORM/"
skills_catalog = "AGENTS/SKILLS/"
troubleshooting = "TROUBLESHOOTING/"

[entry_points]
master_index = "Agents.md"
